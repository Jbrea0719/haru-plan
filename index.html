function parseDateTimeFromMemo(text) {
  if (!text || !text.trim()) return null;
  const now = new Date();
  // 정오(12:00) 기준으로 잡아야 dateKey(toISOString)가 UTC 변환 후에도 로컬 날짜와 일치
  const noon = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0);
  const todayNoon = noon(now);
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const WDAYS = ['일','월','화','수','목','금','토'];
  const WDAY_IDX = { '일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6 };
  let detectedDate = null;
  const consumed = [];

  // 1. (이번주|다음주)? + 요일
  const wm = text.match(/(이번\s*주|다음\s*주)?\s*(월|화|수|목|금|토|일)\s*요일/);
  if (wm) {
    const isNext = wm[1] && wm[1].replace(/\s/g,'').startsWith('다음');
    const target = WDAY_IDX[wm[2]];
    // 오늘부터 1일씩 순회해서 목표 요일에 도달 (diff 모듈러 연산 없이 직접 탐색)
    detectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
    while (detectedDate.getDay() !== target) {
      detectedDate.setDate(detectedDate.getDate() + 1);
    }
    if (isNext) detectedDate.setDate(detectedDate.getDate() + 7);
    consumed.push(wm[0]);
  }

  // 2. 오늘 / 내일 / 모레
  if (!detectedDate) {
    const rm = text.match(/(오늘|내일|모레)/);
    if (rm) {
      const off = { '오늘':0, '내일':1, '모레':2 };
      detectedDate = noon(now);
      detectedDate.setDate(todayNoon.getDate() + off[rm[1]]);
      consumed.push(rm[0]);
    }
  }

  // 3. N월 N일
  if (!detectedDate) {
    const am = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
    if (am) {
      let d = new Date(now.getFullYear(), parseInt(am[1])-1, parseInt(am[2]), 12, 0, 0);
      if (d < todayNoon) d.setFullYear(d.getFullYear()+1);
      detectedDate = d;
      consumed.push(am[0]);
    }
  }

  if (!detectedDate || detectedDate < todayStart) return null;

  // 4. 시간: (오전|오후)? N시 (N분)?
  let timeStr = '';
  const tm = text.match(/(오전|오후)?\s*(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분?)?/);
  if (tm) {
    let h = parseInt(tm[2]);
    const m = tm[3] ? parseInt(tm[3]) : 0;
    if (tm[1] === '오후' && h < 12) h += 12;
    else if (tm[1] === '오전' && h === 12) h = 0;
    else if (!tm[1] && h < 9) h += 12; // 모호한 경우 오후로 추정
    timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    consumed.push(tm[0]);
  }

  // 이벤트 텍스트: 날짜·시간 부분 제거
  let eventText = text;
  consumed.forEach(p => { eventText = eventText.replace(p, ''); });
  eventText = eventText.replace(/\s+/g,' ').trim();
  if (!eventText) eventText = text.trim();

  const label = `${detectedDate.getMonth()+1}월 ${detectedDate.getDate()}일(${WDAYS[detectedDate.getDay()]})`;
  // UTC 변환 오차 방지: 로컬 날짜 컴포넌트로 직접 키 생성
  const dKey = `${detectedDate.getFullYear()}-${String(detectedDate.getMonth()+1).padStart(2,'0')}-${String(detectedDate.getDate()).padStart(2,'0')}`;
  return { dateKey: dKey, timeStr, eventText, label };
}

function fmtTimeLabel(timeStr) {
  if (!timeStr) return '';
  const [h, m] = timeStr.split(':').map(Number);
  const displayH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
  return ` ${h >= 12 ? '오후' : '오전'} ${displayH}시${m ? ` ${m}분` : ''}`;
}

function isMeetingLine(text) {
  const hasParticle = /[가-힣](이랑|랑|와|과)/.test(text);
  const hasMeal = /저녁|점심|아침|식사/.test(text);
  const hasMeetWord = /약속|만남|만나|미팅|모임/.test(text);
  return hasParticle || hasMeal || hasMeetWord;
}

function extractPersonName(text) {
  // 1차: 식사 키워드 제거 후 파티클(랑/와/과)로 이름 추출
  const clean = text.replace(/저녁|점심|아침|식사/g, '').replace(/\s+/g, ' ').trim();
  const pm = clean.match(/([가-힣]{1,5})(이랑|랑|와|과)/);
  if (pm) return pm[1];
  // 2차: 파티클 없을 경우 — 공통 단어 제거 후 남은 2~5자 한글 단어를 이름으로 간주
  const noStop = text.replace(/저녁|점심|아침|식사|약속|만남|만나|미팅|모임|회의|일정|식당/g, '').replace(/\s+/g, ' ').trim();
  const nm = noStop.match(/([가-힣]{2,5})/);
  return nm ? nm[1] : null;
}

function extractMeal(text) {
  if (text.includes('저녁')) return 'dinner';
  if (text.includes('점심')) return 'lunch';
  return '';
}

function autoScheduleFromMemo(memo) {
  const combined = ((memo.title || '') + '\n' + (memo.content || '')).trim();
  const lines = combined.split('\n').map(l => l.trim()).filter(l => l);
  const created = [];

  for (const line of lines) {
    const parsed = parseDateTimeFromMemo(line);
    if (!parsed) continue;

    const data = load();
    if (!data[parsed.dateKey]) data[parsed.dateKey] = { tasks: [], people: [] };
    const newId = uid();

    if (isMeetingLine(parsed.eventText)) {
      const personName = extractPersonName(parsed.eventText);
      if (!personName) {
        // 사람 이름 불명확 → 할일로 등록
        if (data[parsed.dateKey].tasks.some(t => t.text === parsed.eventText)) continue;
        data[parsed.dateKey].tasks.push({ id: newId, text: parsed.eventText, done: false });
        created.push({ type: 'task', dateKey: parsed.dateKey, id: newId, label: parsed.label, timeStr: parsed.timeStr });
      } else {
        if (data[parsed.dateKey].people.some(p => p.name === personName)) continue;
        const agenda = parsed.eventText.replace(/([가-힣]{1,5})(이랑|랑|와|과)\s*/, '').trim();
        data[parsed.dateKey].people.push({
          id: newId, name: personName, agenda,
          timeFrom: parsed.timeStr, timeTo: '', meal: extractMeal(parsed.eventText), met: false
        });
        created.push({ type: 'person', dateKey: parsed.dateKey, id: newId, label: parsed.label, timeStr: parsed.timeStr, name: personName });
      }
    } else {
      if (data[parsed.dateKey].tasks.some(t => t.text === parsed.eventText)) continue;
      data[parsed.dateKey].tasks.push({ id: newId, text: parsed.eventText, done: false });
      created.push({ type: 'task', dateKey: parsed.dateKey, id: newId, label: parsed.label, timeStr: parsed.timeStr });
    }

    save(data);
    if (cloudReady()) pushDay(parsed.dateKey);
  }

  if (!created.length) return;

  const msg = created.length === 1
    ? `📅 ${created[0].label}${fmtTimeLabel(created[0].timeStr)} ${created[0].type === 'person' ? created[0].name + ' 약속' : '할일'} 추가됐어요 [key:${created[0].dateKey}]`
    : `📅 일정 ${created.length}개가 자동 등록됐어요`;

  showScheduleToast(msg, () => {
    const d = load();
    const affectedKeys = [...new Set(created.map(c => c.dateKey))];
    for (const item of created) {
      if (!d[item.dateKey]) continue;
      if (item.type === 'task') d[item.dateKey].tasks = d[item.dateKey].tasks.filter(t => t.id !== item.id);
      else d[item.dateKey].people = d[item.dateKey].people.filter(p => p.id !== item.id);
    }
    save(d);
    affectedKeys.forEach(k => { if (cloudReady()) pushDay(k); });
    showToast('일정 추가를 취소했어요');
  });
}

// ═══════════════════════════════════════
let _dnd = null, _touchClone = null;
function dndStart(e,type,key,idx) {
  _dnd={type,key,idx:+idx,toIdx:+idx}; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(idx));
  requestAnimationFrame(()=>e.currentTarget.classList.add('dnd-dragging'));
}
function dndOver(e,idx) {
  e.preventDefault(); e.dataTransfer.dropEffect='move'; if (!_dnd) return;
  const toIdx=+idx;
  if (toIdx!==_dnd.toIdx) {
    document.querySelectorAll('.dnd-over').forEach(el=>el.classList.remove('dnd-over'));
    if (toIdx!==_dnd.idx) e.currentTarget.classList.add('dnd-over'); _dnd.toIdx=toIdx;
  }
}
function dndDrop(e,type,key,idx) { e.preventDefault(); if (!_dnd) return; dndCommit(_dnd.type,_dnd.key,_dnd.idx,+idx); }
function dndEnd() { document.querySelectorAll('.dnd-dragging,.dnd-over').forEach(el=>el.classList.remove('dnd-dragging','dnd-over')); _dnd=null; }
function touchDndStart(e,type,key,idx) {
  if (e.touches.length!==1) return; e.preventDefault(); e.stopPropagation();
  const touch=e.touches[0], item=e.currentTarget.closest('[data-dnd-idx]'), rect=item.getBoundingClientRect();
  _dnd={type,key,idx:+idx,toIdx:undefined,item,startTouchY:touch.clientY,itemTop:rect.top};
  _touchClone=item.cloneNode(true);
  Object.assign(_touchClone.style,{position:'fixed',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',zIndex:'9999',opacity:'.85',pointerEvents:'none',boxShadow:'0 8px 28px rgba(0,0,0,.22)',transform:'scale(1.02)',borderRadius:'10px',transition:'none'});
  document.body.appendChild(_touchClone); item.style.opacity='.25';
  document.addEventListener('touchmove',_onTouchMove,{passive:false});
  document.addEventListener('touchend',_onTouchEnd,{once:true});
}
function _onTouchMove(e) {
  if (!_dnd||!_touchClone) return; e.preventDefault();
  const touch=e.touches[0], dy=touch.clientY-_dnd.startTouchY;
  _touchClone.style.top=(_dnd.itemTop+dy)+'px';
  _touchClone.style.visibility='hidden';
  const under=document.elementFromPoint(touch.clientX,touch.clientY);
  _touchClone.style.visibility='';
  const target=under?.closest('[data-dnd-idx]');
  document.querySelectorAll('.dnd-over').forEach(el=>el.classList.remove('dnd-over'));
  if (target&&target!==_dnd.item) { target.classList.add('dnd-over'); _dnd.toIdx=+target.dataset.dndIdx; } else _dnd.toIdx=undefined;
}
function _onTouchEnd() {
  document.removeEventListener('touchmove',_onTouchMove);
  if (_touchClone) { _touchClone.remove(); _touchClone=null; }
  if (_dnd?.item) _dnd.item.style.opacity='';
  document.querySelectorAll('.dnd-over').forEach(el=>el.classList.remove('dnd-over'));
  if (_dnd?.toIdx!==undefined&&_dnd.toIdx!==_dnd.idx) dndCommit(_dnd.type,_dnd.key,_dnd.idx,_dnd.toIdx);
  _dnd=null;
}
function dndCommit(type,key,fromIdx,toIdx) {
  if (fromIdx===toIdx) return;
  if (type==='exec') {
    const data=load(), tasks=data[key]?.tasks; if (!tasks) return;
    const [item]=tasks.splice(fromIdx,1); tasks.splice(toIdx,0,item);
    save(data); pushDay(key); renderExec();
  } else { syncPlanDOM(); const [item]=editTasks.splice(fromIdx,1); editTasks.splice(toIdx,0,item); renderPlanHTML(); }
}

let memos = [];
let memoFolders = [];
let activeFolderId = null;
let memoSearchQuery = '';

const MEMO_COLOR_BG = {
  '': '#FFFFFF', 'yellow': '#FEF9C3', 'green': '#DCFCE7',
  'blue': '#DBEAFE', 'pink': '#FCE7F3', 'red': '#FEE2E2', 'purple': '#EDE9FE'
};

async function syncAll() {
  await pullFromCloud();
  await pullMemos();
}

async function pullMemos() {
  if (!cloudReady()) return;
  const [mr, fr] = await Promise.all([
    sbClient.from('memos').select('*').eq('user_id', currentUser.id).order('updated_at', { ascending: false }),
    sbClient.from('memo_folders').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: true })
  ]);
  if (mr.error) { console.error('[pullMemos]', mr.error); return; }
  memos = mr.data || [];
  if (!fr.error) memoFolders = fr.data || [];
  else console.error('[pullFolders]', fr.error);
  if (mainTab === 'memo') renderMemoList();
}

async function createMemo() {
  if (!cloudReady()) { showToast('로그인이 필요해요'); return; }
  const { data, error } = await sbClient.from('memos').insert({
    user_id: currentUser.id, title: '', content: '',
    folder_id: activeFolderId, tags: [], pinned: false, color: '',
    has_checklist: false, checklist: []
  }).select().single();
  if (error) { showToast('메모 생성 실패'); console.error(error); return; }
  memos.unshift(data);
  renderMemoList();
  openMemoEditor(data.id);
}

async function deleteMemo(id) {
  if (!confirm('이 메모를 삭제할까요?\n되돌릴 수 없어요.')) return;
  const { error } = await sbClient.from('memos').delete().eq('id', id).eq('user_id', currentUser.id);
  if (error) { showToast('삭제 실패'); return; }
  memos = memos.filter(m => m.id !== id);
  renderMemoList();
  showToast('삭제됐어요');
}

async function createFolder() {
  const name = prompt('폴더 이름을 입력하세요');
  if (!name?.trim()) return;
  const { data, error } = await sbClient.from('memo_folders').insert({
    user_id: currentUser.id, name: name.trim(), icon: '📁'
  }).select().single();
  if (error) { showToast('폴더 생성 실패'); return; }
  memoFolders.push(data);
  renderMemoList();
}

function switchMemoFolder(id) { activeFolderId = id; renderMemoList(); }

function memoSearch(q) { memoSearchQuery = q; renderMemoList(); }

function getFilteredMemos() {
  let list = activeFolderId !== null
    ? memos.filter(m => m.folder_id === activeFolderId)
    : memos;
  if (memoSearchQuery.trim()) {
    const q = memoSearchQuery.trim().toLowerCase();
    list = list.filter(m =>
      (m.title || '').toLowerCase().includes(q) ||
      (m.content || '').toLowerCase().includes(q)
    );
  }
  return [...list.filter(m => m.pinned), ...list.filter(m => !m.pinned)];
}

function formatMemoDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr), now = new Date();
  const diffMin = Math.floor((now - d) / 60000);
  if (diffMin < 1) return '방금';
  if (diffMin < 60) return `${diffMin}분 전`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `${diffH}시간 전`;
  const diffD = Math.floor(diffH / 24);
  if (diffD < 7) return `${diffD}일 전`;
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function renderMemoFolders() {
  const el = document.getElementById('memo-folders'); if (!el) return;
  let html = `<div class="memo-folder-chip ${activeFolderId === null ? 'active' : ''}" onclick="switchMemoFolder(null)">전체 <span class="memo-folder-count">${memos.length}</span></div>`;
  memoFolders.forEach(f => {
    const cnt = memos.filter(m => m.folder_id === f.id).length;
    html += `<div class="memo-folder-chip ${activeFolderId === f.id ? 'active' : ''}" onclick="switchMemoFolder('${f.id}')">${esc(f.icon)} ${esc(f.name)} <span class="memo-folder-count">${cnt}</span></div>`;
  });
  html += `<button class="memo-folder-add" onclick="createFolder()">＋</button>`;
  el.innerHTML = html;
}

function renderMemoList() {
  renderMemoFolders();
  const grid = document.getElementById('memo-grid'); if (!grid) return;
  const list = getFilteredMemos();
  if (!list.length) {
    const noData = memoSearchQuery ? ['검색 결과가 없어요','다른 키워드로 검색해보세요'] : ['메모가 없어요','＋ 새 메모를 눌러 첫 메모를 작성해보세요'];
    grid.innerHTML = `<div class="memo-empty"><div class="memo-empty-icon">📝</div><div class="memo-empty-title">${noData[0]}</div><div class="memo-empty-desc">${noData[1]}</div></div>`;
    return;
  }
  grid.innerHTML = list.map(m => {
    const bg = MEMO_COLOR_BG[m.color] || '#FFFFFF';
    const title = m.title || '';
    let preview;
    if (m.has_checklist) {
      const items = m.checklist || [];
      const doneCount = items.filter(i => i.done).length;
      preview = items.length ? `☑ ${doneCount}/${items.length} 완료` : '☑ 체크리스트';
    } else {
      preview = (m.content || '').slice(0, 80) + ((m.content || '').length > 80 ? '…' : '');
    }
    return `<div class="memo-card" style="background:${bg}" onclick="openMemoEditor('${m.id}')">
      <div class="memo-card-top">
        ${m.pinned ? '<span class="memo-pin-icon">📌</span>' : ''}
        <button class="memo-card-del" onclick="event.stopPropagation();deleteMemo('${m.id}')">🗑</button>
      </div>
      <div class="memo-card-title${!title ? ' placeholder' : ''}">${esc(title || '제목 없음')}</div>
      ${preview ? `<div class="memo-card-preview">${esc(preview)}</div>` : ''}
      <div class="memo-card-date">${formatMemoDate(m.updated_at)}</div>
    </div>`;
  }).join('');
}

const MEMO_COLOR_KEYS = ['', 'yellow', 'green', 'blue', 'pink', 'red', 'purple'];
let currentMemoId = null;
let memoSaveTimer = null;
let memoChecklist = [];

// ── 공통 헬퍼 ──
function showSaveStatus(msg) {
  const el = document.getElementById('memo-save-status'); if (!el) return;
  el.textContent = msg;
  if (msg === '저장됨 ✓') setTimeout(() => { if (el.textContent === '저장됨 ✓') el.textContent = ''; }, 2000);
}

function getChecklistFromDOM() {
  return memoChecklist.map((item, i) => ({
    ...item,
    text: document.querySelector(`[data-cl-idx="${i}"]`)?.value ?? item.text
  }));
}

function rerenderBody() {
  const memo = memos.find(m => m.id === currentMemoId); if (!memo) return;
  const el = document.getElementById('memo-editor-body'); if (!el) return;
  if (memo.has_checklist) {
    el.innerHTML = getChecklistHTML(memoChecklist) +
      `<button class="memo-cl-add" onclick="addClItem()">＋ 항목 추가</button>`;
  }
}

// ── 열기 / 닫기 ──
function openMemoEditor(id) {
  const memo = memos.find(m => m.id === id); if (!memo) return;
  currentMemoId = id;
  memoChecklist = (memo.checklist || []).map(item => ({ ...item }));
  const panel = document.getElementById('memo-editor-panel');
  panel.style.background = MEMO_COLOR_BG[memo.color] || '#FFFFFF';
  document.getElementById('memo-editor-title').value = memo.title || '';
  showSaveStatus('');
  renderMemoColorPicker(memo.color || '');
  renderMemoPinBtn(!!memo.pinned);
  renderMemoEditorMeta(memo);
  renderMemoTags(memo.tags || []);
  renderMemoBody(memo);
  history.pushState({ memoEditor: true }, '');
  panel.classList.add('open');
  setTimeout(() => {
    if (!memo.has_checklist) {
      const c = document.getElementById('memo-editor-content');
      if (c) { c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
    }
  }, 320);
}

function closeMemoEditor() {
  clearTimeout(memoSaveTimer);
  memoSaveTimer = null;
  const memo = memos.find(m => m.id === currentMemoId);
  if (memo) {
    memo.title = document.getElementById('memo-editor-title')?.value || '';
    if (memo.has_checklist) { memo.checklist = getChecklistFromDOM(); }
    else { memo.content = document.getElementById('memo-editor-content')?.value || ''; }
    const isEmpty = !memo.title.trim() &&
      !(memo.content || '').trim() &&
      !(memo.checklist || []).some(i => i.text.trim());
    if (isEmpty) {
      deleteMemoSilent(memo.id);
    } else {
      memo.updated_at = new Date().toISOString();
      if (cloudReady()) {
        const payload = { title: memo.title, updated_at: memo.updated_at };
        if (memo.has_checklist) payload.checklist = memo.checklist;
        else payload.content = memo.content;
        sbClient.from('memos').update(payload)
          .eq('id', currentMemoId).eq('user_id', currentUser.id)
          .then(({ error }) => { if (error) console.error('[memo close-save]', error); });
      }
      autoScheduleFromMemo(memo);
    }
  }
  document.getElementById('memo-editor-panel').classList.remove('open');
  currentMemoId = null; memoChecklist = [];
  renderMemoList();
}

function deleteMemoSilent(id) {
  memos = memos.filter(m => m.id !== id);
  if (cloudReady()) {
    sbClient.from('memos').delete().eq('id', id).eq('user_id', currentUser.id)
      .then(({ error }) => { if (error) console.error('[memo silent-delete]', error); });
  }
}

function triggerMemoSave() {
  showSaveStatus('저장 중...');
  clearTimeout(memoSaveTimer);
  memoSaveTimer = setTimeout(saveMemoNow, 1500);
}

async function saveMemoNow() {
  if (!currentMemoId || !cloudReady()) return;
  memoSaveTimer = null;
  const memo = memos.find(m => m.id === currentMemoId); if (!memo) return;
  memo.title = document.getElementById('memo-editor-title')?.value || '';
  const payload = { title: memo.title, updated_at: new Date().toISOString() };
  if (memo.has_checklist) {
    memo.checklist = getChecklistFromDOM();
    payload.checklist = memo.checklist;
  } else {
    memo.content = document.getElementById('memo-editor-content')?.value || '';
    payload.content = memo.content;
  }
  memo.updated_at = payload.updated_at;
  const { error } = await sbClient.from('memos').update(payload)
    .eq('id', currentMemoId).eq('user_id', currentUser.id);
  if (error) { showSaveStatus('저장 실패'); console.error(error); return; }
  showSaveStatus('저장됨 ✓');
}

// ── 핀 ──
function renderMemoPinBtn(pinned) {
  const btn = document.getElementById('memo-pin-btn');
  if (btn) btn.classList.toggle('pinned', pinned);
}

async function toggleMemoPin() {
  if (!currentMemoId || !cloudReady()) return;
  const memo = memos.find(m => m.id === currentMemoId); if (!memo) return;
  memo.pinned = !memo.pinned;
  renderMemoPinBtn(memo.pinned);
  await sbClient.from('memos').update({ pinned: memo.pinned })
    .eq('id', currentMemoId).eq('user_id', currentUser.id);
  showSaveStatus('저장됨 ✓');
}

// ── 메타 (폴더 + 체크리스트 모드) ──
function renderMemoEditorMeta(memo) {
  const sel = document.getElementById('memo-folder-select');
  if (sel) {
    sel.innerHTML = `<option value="">📁 폴더 없음</option>` +
      memoFolders.map(f =>
        `<option value="${f.id}"${memo.folder_id === f.id ? ' selected' : ''}>${esc(f.icon)} ${esc(f.name)}</option>`
      ).join('');
  }
  const clBtn = document.getElementById('memo-cl-toggle');
  if (clBtn) clBtn.classList.toggle('active', !!memo.has_checklist);
}

async function setMemoFolder(folderId) {
  if (!currentMemoId || !cloudReady()) return;
  const memo = memos.find(m => m.id === currentMemoId); if (!memo) return;
  memo.folder_id = folderId || null;
  await sbClient.from('memos').update({ folder_id: memo.folder_id })
    .eq('id', currentMemoId).eq('user_id', currentUser.id);
  showSaveStatus('저장됨 ✓');
}

// ── 태그 ──
function renderMemoTags(tags) {
  const el = document.getElementById('memo-editor-tags'); if (!el) return;
  const chips = (tags || []).map((t, i) =>
    `<span class="memo-tag-chip">#${esc(t)}<button class="memo-tag-del" onclick="removeMemoTag(${i})">×</button></span>`
  ).join('');
  el.innerHTML = chips + `<input class="memo-tag-input" id="memo-tag-input" placeholder="태그 추가 (Enter)" onkeydown="onTagKeydown(event)">`;
}

async function addMemoTag(tag) {
  const memo = memos.find(m => m.id === currentMemoId); if (!memo) return;
  tag = tag.replace(/^#/, '').trim();
  if (!tag || (memo.tags || []).includes(tag)) return;
  memo.tags = [...(memo.tags || []), tag];
  renderMemoTags(memo.tags);
  document.getElementById('memo-tag-input')?.focus();
  await sbClient.from('memos').update({ tags: memo.tags })
    .eq('id', currentMemoId).eq('user_id', currentUser.id);
  showSaveStatus('저장됨 ✓');
}

async function removeMemoTag(idx) {
  const memo = memos.find(m => m.id === currentMemoId); if (!memo) return;
  memo.tags = (memo.tags || []).filter((_, i) => i !== idx);
  renderMemoTags(memo.tags);
  await sbClient.from('memos').update({ tags: memo.tags })
    .eq('id', currentMemoId).eq('user_id', currentUser.id);
  showSaveStatus('저장됨 ✓');
}

function onTagKeydown(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = e.target.value.trim();
    if (val) { e.target.value = ''; addMemoTag(val); }
  }
}

// ── 바디 (텍스트 / 체크리스트) ──
function renderMemoBody(memo) {
  const el = document.getElementById('memo-editor-body'); if (!el) return;
  if (memo.has_checklist) {
    el.innerHTML = getChecklistHTML(memoChecklist) +
      `<button class="memo-cl-add" onclick="addClItem()">＋ 항목 추가</button>`;
  } else {
    el.innerHTML = `<textarea class="memo-editor-content" id="memo-editor-content" placeholder="내용을 입력하세요..." oninput="triggerMemoSave()"></textarea>`;
    document.getElementById('memo-editor-content').value = memo.content || '';
  }
}

function getChecklistHTML(items) {
  return `<div class="memo-checklist">${(items || []).map((item, i) =>
    `<div class="memo-cl-item">
      <div class="memo-cl-check${item.done ? ' done' : ''}" onclick="toggleClItem(${i})"></div>
      <input class="memo-cl-text${item.done ? ' done' : ''}" value="${esc(item.text)}"
        data-cl-idx="${i}" oninput="onClInput(${i},this.value)"
        onkeydown="onClKeydown(event,${i})" placeholder="항목 입력...">
      <button class="memo-cl-del" onclick="removeClItem(${i})">×</button>
    </div>`
  ).join('')}</div>`;
}

async function toggleChecklistMode() {
  if (!currentMemoId) return;
  const memo = memos.find(m => m.id === currentMemoId); if (!memo) return;
  if (!memo.has_checklist) {
    const c = document.getElementById('memo-editor-content');
    if (c) memo.content = c.value;
    if (!memoChecklist.length) memoChecklist = [{ id: uid(), text: '', done: false }];
  } else {
    memoChecklist = getChecklistFromDOM();
    memo.checklist = [...memoChecklist];
  }
  memo.has_checklist = !memo.has_checklist;
  document.getElementById('memo-cl-toggle')?.classList.toggle('active', memo.has_checklist);
  renderMemoBody(memo);
  if (cloudReady()) {
    await sbClient.from('memos').update({
      has_checklist: memo.has_checklist,
      checklist: memo.checklist || [],
      content: memo.content || ''
    }).eq('id', currentMemoId).eq('user_id', currentUser.id);
  }
  showSaveStatus('저장됨 ✓');
}

function toggleClItem(idx) {
  memoChecklist = getChecklistFromDOM();
  memoChecklist[idx].done = !memoChecklist[idx].done;
  const memo = memos.find(m => m.id === currentMemoId);
  if (memo) memo.checklist = [...memoChecklist];
  rerenderBody(); triggerMemoSave();
}

function addClItem() {
  memoChecklist = getChecklistFromDOM();
  memoChecklist.push({ id: uid(), text: '', done: false });
  rerenderBody(); triggerMemoSave();
  setTimeout(() => {
    const inputs = document.querySelectorAll('[data-cl-idx]');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }, 30);
}

function removeClItem(idx) {
  memoChecklist = getChecklistFromDOM();
  memoChecklist.splice(idx, 1);
  if (!memoChecklist.length) memoChecklist.push({ id: uid(), text: '', done: false });
  rerenderBody(); triggerMemoSave();
}

function onClInput(idx, val) {
  if (memoChecklist[idx]) memoChecklist[idx].text = val;
  triggerMemoSave();
}

function onClKeydown(e, idx) {
  if (e.key === 'Enter') {
    e.preventDefault();
    memoChecklist = getChecklistFromDOM();
    memoChecklist.splice(idx + 1, 0, { id: uid(), text: '', done: false });
    rerenderBody();
    setTimeout(() => {
      document.querySelector(`[data-cl-idx="${idx + 1}"]`)?.focus();
    }, 30);
  }
}

// ── 컬러 ──
async function setMemoColor(color) {
  if (!currentMemoId || !cloudReady()) return;
  const memo = memos.find(m => m.id === currentMemoId); if (!memo) return;
  memo.color = color;
  const bg = MEMO_COLOR_BG[color] || '#FFFFFF';
  document.getElementById('memo-editor-panel').style.background = bg;
  renderMemoColorPicker(color);
  await sbClient.from('memos').update({ color })
    .eq('id', currentMemoId).eq('user_id', currentUser.id);
  showSaveStatus('저장됨 ✓');
}

function renderMemoColorPicker(activeColor) {
  const el = document.getElementById('memo-color-picker'); if (!el) return;
  el.innerHTML = MEMO_COLOR_KEYS.map(c =>
    `<button class="memo-color-dot${c === activeColor ? ' active' : ''}"
      style="background:${MEMO_COLOR_BG[c]}"
      onclick="setMemoColor('${c}')"></button>`
  ).join('');
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
window.addEventListener('popstate', () => {
  if (currentMemoId) closeMemoEditor();
});

initApp();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(console.error);
  });
}
</script>
