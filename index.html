<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>하루 계획</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #F5F4F0;
      --surface: #FFFFFF;
      --border: #E8E3DC;
      --text-primary: #1C1C1E;
      --text-secondary: #6B6B70;
      --text-muted: #AEAEB2;
      --accent: #4F46E5;
      --accent-soft: #EEF2FF;
      --green: #16A34A;
      --green-soft: #DCFCE7;
      --amber: #D97706;
      --amber-soft: #FEF3C7;
      --red: #DC2626;
      --radius: 14px;
      --radius-sm: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100svh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ─── AUTH SCREEN ─── */
    .auth-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 24px;
    }
    .auth-card {
      background: #fff; border-radius: 24px;
      padding: 36px 28px; width: 100%; max-width: 380px;
      box-shadow: 0 24px 80px rgba(0,0,0,.25);
    }
    .auth-logo { font-size: 28px; font-weight: 900; color: var(--accent); letter-spacing: -1px; margin-bottom: 3px; }
    .auth-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }
    .auth-mode-tabs {
      display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 20px;
    }
    .auth-mode-tab {
      flex: 1; padding: 9px; text-align: center; font-size: 14px; font-weight: 600;
      cursor: pointer; border-radius: 8px; transition: all .15s; color: var(--text-muted);
      border: none; background: none; font-family: inherit;
    }
    .auth-mode-tab.active { background: #fff; color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    .auth-input {
      width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 13px 14px; font-size: 15px; font-family: inherit;
      background: var(--surface); color: var(--text-primary); outline: none;
      margin-bottom: 10px; transition: border-color .15s, box-shadow .15s;
    }
    .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .auth-error { font-size: 13px; color: var(--red); min-height: 18px; margin-bottom: 12px; text-align: center; }
    .auth-submit {
      width: 100%; padding: 15px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius); font-size: 16px; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: background .15s, transform .1s;
    }
    .auth-submit:active { transform: scale(.98); background: #4338CA; }
    .auth-submit:disabled { opacity: .6; cursor: default; }
    .auth-autologin {
      display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
      cursor: pointer; user-select: none;
    }
    .auth-autologin input[type="checkbox"] {
      width: 17px; height: 17px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0;
    }
    .auth-autologin span { font-size: 13px; color: var(--text-secondary); }

    /* ─── HEADER ─── */
    .header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 16px 0; position: sticky; top: 0; z-index: 20;
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .app-name { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .user-btn {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); color: #fff; border: none; cursor: pointer;
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; transition: opacity .15s;
    }
    .user-btn:active { opacity: .7; }

    /* ─── MAIN TABS ─── */
    .main-tabs-row { display: flex; }
    .main-tab {
      flex: 1; padding: 9px 8px; text-align: center; font-size: 14px; font-weight: 500;
      color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
      transition: all .15s; user-select: none;
    }
    .main-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

    /* ─── DATE NAV ROW ─── */
    .date-nav-row { display: flex; align-items: center; justify-content: center; padding: 8px 0 0; }
    .date-nav { display: flex; align-items: center; gap: 2px; }
    .nav-btn {
      background: none; border: none; width: 32px; height: 32px; cursor: pointer;
      color: var(--text-secondary); font-size: 20px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; transition: background .1s;
    }
    .nav-btn:active { background: var(--bg); }
    .date-chip { font-size: 13px; color: var(--text-secondary); font-weight: 500; padding: 0 4px; white-space: nowrap; }
    .today-jump {
      font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
      border: none; padding: 4px 8px; border-radius: 100px; cursor: pointer; margin-left: 4px;
    }

    /* ─── SUB-TABS ─── */
    .tabs { display: flex; }
    .tab {
      flex: 1; padding: 9px 8px; text-align: center; font-size: 14px; font-weight: 500;
      color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
      transition: all .15s; user-select: none;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

    /* ─── CONTENT ─── */
    .content { padding: 20px 16px 60px; }

    /* ─── STATS CARD ─── */
    .stats-card {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: #fff; border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px;
    }
    .stats-label { font-size: 12px; opacity: .75; margin-bottom: 10px; font-weight: 500; }
    .stats-row { display: flex; gap: 20px; margin-bottom: 12px; }
    .stat-item { display: flex; flex-direction: column; }
    .stat-num { font-size: 26px; font-weight: 800; line-height: 1; }
    .stat-desc { font-size: 11px; opacity: .7; margin-top: 3px; }
    .progress-track { background: rgba(255,255,255,.25); height: 5px; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: #fff; border-radius: 3px; transition: width .4s cubic-bezier(.4,0,.2,1); }

    /* ─── SECTION ─── */
    .section { margin-bottom: 24px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); }
    .section-badge { font-size: 11px; color: var(--text-muted); font-weight: 500; }

    /* ─── DRAG & DROP ─── */
    .drag-handle {
      width: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      color: var(--border); font-size: 17px; letter-spacing: -1px;
      cursor: grab; user-select: none; touch-action: none; margin-right: 2px;
    }
    .drag-handle:active { cursor: grabbing; color: var(--accent); }
    [draggable].dnd-dragging { opacity: .3; }
    [draggable].dnd-over { outline: 2px solid var(--accent); outline-offset: -1px; border-radius: var(--radius-sm); }

    /* ─── TASK ITEM ─── */
    .task-item {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 13px 14px;
      display: flex; align-items: flex-start; gap: 11px;
      margin-bottom: 7px; transition: opacity .2s, border-color .2s; cursor: default;
    }
    .task-item.carried { border-left: 3px solid var(--amber); }
    .task-item.done { opacity: .45; }
    .task-check {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
      cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all .15s; margin-top: 1px;
    }
    .task-check:active { transform: scale(.88); }
    .task-check.done { background: var(--accent); border-color: var(--accent); }
    .task-check.done::after {
      content: ''; width: 5px; height: 9px; border: 2px solid #fff;
      border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px);
    }
    .task-body { flex: 1; min-width: 0; }
    .task-text { font-size: 15px; line-height: 1.4; word-break: keep-all; }
    .task-item.done .task-text { text-decoration: line-through; }
    .empty-people { padding: 14px 16px; color: var(--text-muted); font-size: 14px; text-align: center; }
    .carried-tag {
      display: inline-block; font-size: 10px; font-weight: 600;
      background: var(--amber-soft); color: var(--amber); padding: 2px 6px; border-radius: 4px; margin-top: 4px;
    }

    /* ─── PERSON ITEM ─── */
    .person-item {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 14px;
      display: flex; align-items: center; gap: 12px; margin-bottom: 7px; transition: opacity .2s;
    }
    .person-item.met { opacity: .45; }
    .person-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
      font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .person-name { font-size: 15px; font-weight: 500; }
    .person-item.met .person-name { text-decoration: line-through; }
    .person-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .person-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .person-agenda { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .time-badge { font-size: 11px; color: var(--text-muted); }
    .meal-badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 100px; }
    .meal-badge.lunch  { background: var(--amber-soft); color: var(--amber); }
    .meal-badge.dinner { background: var(--accent-soft); color: var(--accent); }

    .person-detail-row { display: flex; align-items: center; gap: 6px; margin: 5px 0 4px 38px; flex-wrap: wrap; }
    .time-sep { font-size: 13px; color: var(--text-muted); }
    .time-picker {
      display: inline-flex; align-items: center; gap: 1px;
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 7px;
      padding: 5px 8px; transition: border-color .15s;
    }
    .time-picker:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .time-picker select {
      border: none; background: none; outline: none; font-family: inherit; font-size: 14px;
      color: var(--text-primary); cursor: pointer; padding: 0; text-align: center;
      -webkit-appearance: none; appearance: none;
    }
    .tp-h { width: 30px; }
    .tp-m { width: 32px; }
    .tp-sep { font-size: 13px; font-weight: 700; color: var(--text-muted); margin: 0 1px; }
    .meal-select {
      border: 1.5px solid var(--border); border-radius: 7px; padding: 6px 10px; font-size: 13px;
      font-family: inherit; background: var(--surface); color: var(--text-primary); outline: none; cursor: pointer;
    }
    .meal-select:focus { border-color: var(--accent); }

    .person-edit-form { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .person-edit-detail { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .person-edit-actions { display: flex; gap: 4px; justify-content: flex-end; }
    .person-check {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
      cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .person-check:active { transform: scale(.88); }
    .person-check.met { background: var(--green); border-color: var(--green); }
    .person-check.met::after {
      content: ''; width: 5px; height: 9px; border: 2px solid #fff;
      border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px);
    }

    /* ─── EMPTY STATE ─── */
    .empty { text-align: center; padding: 56px 24px; }
    .empty-icon { font-size: 52px; margin-bottom: 14px; line-height: 1; }
    .empty-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; color: var(--text-secondary); }
    .empty-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

    /* ─── PLAN FORM ─── */
    .plan-notice {
      background: var(--accent-soft); border-radius: var(--radius-sm); padding: 12px 14px;
      font-size: 13px; color: var(--accent); font-weight: 500; margin-bottom: 20px; line-height: 1.4;
    }
    .plan-notice strong { font-weight: 700; }
    .plan-date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .plan-nav-btn {
      width: 28px; height: 28px; border: none; background: rgba(255,255,255,.5); color: var(--accent);
      border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; transition: background .15s;
    }
    .plan-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,.8); }
    .plan-nav-btn:disabled { opacity: .3; cursor: default; }
    .plan-section { margin-bottom: 24px; }
    .plan-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 10px; }
    .plan-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .plan-num {
      width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
      font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .plan-num.green-num { background: var(--green-soft); color: var(--green); }
    .plan-input {
      flex: 1; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 11px 13px;
      font-size: 15px; background: var(--surface); color: var(--text-primary); outline: none; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .plan-input::placeholder { color: var(--text-muted); }
    .plan-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .plan-input.carried { background: #FFFBEB; border-color: #FCD34D; }
    .carried-hint { font-size: 11px; color: var(--amber); margin: -2px 0 5px 34px; font-weight: 500; }
    .save-btn {
      width: 100%; padding: 16px; background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius); font-size: 16px; font-weight: 700; cursor: pointer;
      margin-top: 8px; font-family: inherit; letter-spacing: -0.2px; transition: background .15s, transform .1s;
    }
    .save-btn:active { transform: scale(.98); background: #4338CA; }

    /* ─── SYNC DOT ─── */
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background .3s; }
    .sync-dot.syncing { background: var(--amber); animation: pulse .8s infinite; }
    .sync-dot.ok      { background: var(--green); }
    .sync-dot.err     { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ─── OVERLAY / PANEL ─── */
    .overlay-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .overlay-backdrop.open { opacity: 1; pointer-events: all; }
    .settings-panel {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
      width: 100%; max-width: 480px; background: var(--surface);
      border-radius: 20px 20px 0 0; z-index: 50; padding: 0 0 40px;
      transition: transform .3s cubic-bezier(.4,0,.2,1); max-height: 90svh; overflow-y: auto;
    }
    .settings-panel.open { transform: translateX(-50%) translateY(0); }
    .panel-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
    .panel-title { font-size: 16px; font-weight: 700; padding: 16px 20px 0; display: flex; align-items: center; justify-content: space-between; }
    .panel-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-muted); padding: 4px; }
    .panel-section { padding: 16px 20px 0; }
    .panel-section-title { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
    .panel-btn {
      display: block; width: 100%; padding: 13px 16px; border: none; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
      transition: background .15s; margin-top: 8px; text-align: left;
      background: var(--bg); color: var(--text-secondary);
    }
    .panel-btn:active { background: var(--border); }
    .panel-btn.danger { background: #FEE2E2; color: var(--red); }
    .panel-btn.danger:active { background: #FECACA; }

    /* ─── INLINE EDIT ─── */
    .edit-btn {
      width: 28px; height: 28px; flex-shrink: 0; border: none; background: none; cursor: pointer;
      color: var(--text-muted); border-radius: 6px; font-size: 14px;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .edit-btn:hover  { background: var(--bg); color: var(--text-secondary); }
    .edit-btn:active { background: var(--border); }
    .del-btn {
      width: 28px; height: 28px; flex-shrink: 0; border: none; background: none; cursor: pointer;
      color: var(--text-muted); border-radius: 6px; font-size: 13px;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .del-btn:hover  { background: #fee2e2; color: #ef4444; }
    .del-btn:active { background: #fecaca; }
    .inline-edit-wrap { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .inline-edit-input {
      flex: 1; min-width: 0; border: 1.5px solid var(--accent); border-radius: 8px; padding: 6px 10px;
      font-size: 15px; font-family: inherit; background: var(--surface); color: var(--text-primary); outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .inline-confirm-btn {
      width: 28px; height: 28px; flex-shrink: 0; border: none; background: var(--accent); color: #fff;
      border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .inline-cancel-btn {
      width: 28px; height: 28px; flex-shrink: 0; border: none; background: var(--bg); color: var(--text-secondary);
      border-radius: 7px; cursor: pointer; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ─── CALENDAR POPUP ─── */
    .cal-btn {
      background: none; border: none; width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
      font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); transition: background .1s; flex-shrink: 0;
    }
    .cal-btn:active { background: var(--bg); }
    .cal-popup {
      position: fixed; top: 166px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 24px); max-width: 340px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 8px 32px rgba(0,0,0,.14);
      z-index: 35; display: none; overflow: hidden;
    }
    .cal-popup.open { display: block; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
    .cal-month-label { font-size: 15px; font-weight: 700; }
    .cal-nav-row { display: flex; gap: 2px; }
    .cal-nav {
      background: none; border: none; width: 28px; height: 28px; border-radius: 7px; cursor: pointer;
      font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center;
    }
    .cal-nav:hover { background: var(--bg); }
    .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 10px 4px; }
    .cal-dow-cell { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 2px 0; }
    .cal-dow-cell:first-child { color: #EF4444; }
    .cal-dow-cell:last-child  { color: var(--accent); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 10px 12px; gap: 1px; }
    .cal-cell {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 500; border-radius: 50%; cursor: pointer;
      transition: background .1s; position: relative;
    }
    .cal-cell:hover { background: var(--bg); }
    .cal-cell.other  { color: var(--text-muted); }
    .cal-cell.today  { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .cal-cell.sel    { background: var(--accent); color: #fff !important; font-weight: 700; }
    .cal-cell.has-plan::after {
      content: ''; position: absolute; bottom: 2px;
      width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
    }
    .cal-cell.sel.has-plan::after { background: rgba(255,255,255,.7); }

    /* ─── PLAN REPEAT / ADD ─── */
    .repeat-btn {
      width: 28px; height: 28px; flex-shrink: 0; border: none; background: none; cursor: pointer;
      color: var(--text-muted); border-radius: 6px; font-size: 14px;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .repeat-btn:hover { background: var(--bg); }
    .repeat-btn.on { color: var(--accent); background: var(--accent-soft); }
    .add-row-btn {
      width: 100%; padding: 10px; border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
      background: none; color: var(--text-muted); font-size: 14px; font-weight: 500; font-family: inherit;
      cursor: pointer; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 5px; transition: all .15s;
    }
    .add-row-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .remove-row-btn {
      width: 28px; height: 28px; flex-shrink: 0; border: none; background: none; cursor: pointer;
      color: var(--text-muted); border-radius: 6px; font-size: 18px;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .remove-row-btn:hover { background: #FEE2E2; color: var(--red); }

    /* ─── TOAST ─── */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1C1C1E; color: #fff; padding: 11px 20px; border-radius: 100px;
      font-size: 14px; font-weight: 500; z-index: 100;
      transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .28s;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── ALL DONE BANNER ─── */
    .all-done-banner {
      background: linear-gradient(135deg, #16A34A, #15803D); color: #fff;
      border-radius: var(--radius); padding: 16px 20px; text-align: center;
      margin-bottom: 20px; font-size: 15px; font-weight: 600;
    }
    .all-done-banner .banner-emoji { font-size: 28px; display: block; margin-bottom: 6px; }

    /* ─── HISTORY ─── */
    .history-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .hs-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 10px; text-align: center; }
    .hs-num { font-size: 22px; font-weight: 800; color: var(--text-primary); line-height: 1; }
    .hs-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
    .history-month { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin: 20px 0 8px; }
    .history-month:first-of-type { margin-top: 0; }
    .hist-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; margin-bottom: 7px; cursor: pointer; transition: border-color .15s; }
    .hist-card:active { border-color: var(--accent); }
    .hist-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .hist-date { font-size: 14px; font-weight: 600; }
    .hist-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 100px; }
    .hist-badge.perfect { background: var(--green-soft); color: var(--green); }
    .hist-badge.partial { background: var(--amber-soft); color: var(--amber); }
    .hist-badge.none    { background: var(--bg); color: var(--text-muted); }
    .hist-badge.future  { background: var(--accent-soft); color: var(--accent); }
    .hist-bar-track { background: var(--bg); height: 4px; border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
    .hist-bar-fill { height: 100%; border-radius: 2px; transition: width .3s; }
    .hist-bar-fill.perfect { background: var(--green); }
    .hist-bar-fill.partial  { background: var(--amber); }
    .hist-bar-fill.none     { background: var(--border); }
    .hist-bar-fill.future   { background: var(--accent); }
    .hist-del-btn { width: 26px; height: 26px; flex-shrink: 0; border: none; background: none; cursor: pointer; color: var(--text-muted); border-radius: 6px; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all .15s; margin-left: 6px; }
    .hist-del-btn:hover  { background: #fee2e2; color: #ef4444; }
    .hist-del-btn:active { background: #fecaca; }
    .hist-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); }
    .hist-meta-item { display: flex; align-items: center; gap: 3px; }
    .hist-carried { margin-left: auto; font-size: 11px; color: var(--amber); font-weight: 600; }

    /* ─── MEMO ─── */
    .memo-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .memo-search-wrap {
      flex: 1; display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 9px 12px; transition: border-color .15s;
    }
    .memo-search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .memo-search-icon { font-size: 14px; flex-shrink: 0; }
    .memo-search-input {
      flex: 1; border: none; outline: none; background: none;
      font-size: 14px; font-family: inherit; color: var(--text-primary);
    }
    .memo-search-input::placeholder { color: var(--text-muted); }
    .memo-new-btn {
      padding: 10px 14px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background .15s;
    }
    .memo-new-btn:active { background: #4338CA; }
    .memo-folders {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 14px;
      scrollbar-width: none;
    }
    .memo-folders::-webkit-scrollbar { display: none; }
    .memo-folder-chip {
      flex-shrink: 0; padding: 6px 12px; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 100px;
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; transition: all .15s; user-select: none;
      display: flex; align-items: center; gap: 4px;
    }
    .memo-folder-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .memo-folder-chip.active .memo-folder-count { color: rgba(255,255,255,.7); }
    .memo-folder-count { font-size: 11px; color: var(--text-muted); }
    .memo-folder-add {
      flex-shrink: 0; width: 32px; height: 32px; border: 1.5px dashed var(--border);
      border-radius: 100px; background: none; color: var(--text-muted); font-size: 16px;
      cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center;
    }
    .memo-folder-add:active { border-color: var(--accent); color: var(--accent); }
    .memo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .memo-card {
      border-radius: var(--radius); padding: 13px 12px; cursor: pointer;
      transition: transform .15s, box-shadow .15s; position: relative;
      min-height: 100px; border: 1.5px solid rgba(0,0,0,.06);
      display: flex; flex-direction: column;
    }
    .memo-card:active { transform: scale(.97); box-shadow: 0 4px 16px rgba(0,0,0,.12); }
    .memo-card-top {
      display: flex; align-items: center; min-height: 22px; margin-bottom: 4px;
    }
    .memo-pin-icon { font-size: 12px; margin-right: auto; }
    .memo-card-del {
      width: 24px; height: 24px; border: none; background: none; cursor: pointer;
      font-size: 12px; color: var(--text-muted); border-radius: 5px;
      display: flex; align-items: center; justify-content: center; transition: background .15s;
      margin-left: auto; flex-shrink: 0;
    }
    .memo-card-del:active { background: rgba(0,0,0,.1); }
    .memo-card-title {
      font-size: 14px; font-weight: 700; color: var(--text-primary);
      line-height: 1.3; margin-bottom: 5px; word-break: break-word;
    }
    .memo-card-title.placeholder { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .memo-card-preview {
      font-size: 12px; color: var(--text-secondary); line-height: 1.5; flex: 1;
      word-break: break-word; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    }
    .memo-card-date { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
    .memo-empty {
      grid-column: 1 / -1; text-align: center; padding: 56px 24px;
    }
    .memo-empty-icon { font-size: 48px; margin-bottom: 12px; }
    .memo-empty-title { font-size: 16px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .memo-empty-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

    /* ─── MEMO EDITOR ─── */
    .memo-editor-panel {
      position: fixed; top: 0; bottom: 0;
      left: 50%; transform: translateX(-50%) translateY(100%);
      width: 100%; max-width: 480px; z-index: 60;
      display: flex; flex-direction: column;
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      background: var(--surface);
    }
    .memo-editor-panel.open { transform: translateX(-50%) translateY(0); }
    .memo-editor-header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-bottom: 1px solid rgba(0,0,0,.08);
      flex-shrink: 0; background: inherit;
    }
    .memo-editor-back {
      border: none; background: none; font-size: 14px; font-weight: 600;
      color: var(--accent); cursor: pointer; padding: 6px 8px; border-radius: 8px;
      font-family: inherit; flex-shrink: 0; transition: background .15s;
    }
    .memo-editor-back:active { background: var(--accent-soft); }
    .memo-color-picker { display: flex; gap: 6px; flex: 1; justify-content: center; }
    .memo-color-dot {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(0,0,0,.12); cursor: pointer;
      transition: transform .15s, border-color .15s; flex-shrink: 0;
    }
    .memo-color-dot.active { transform: scale(1.3); border-color: rgba(0,0,0,.4); }
    .memo-color-dot:active { opacity: .7; }
    .memo-save-status {
      font-size: 12px; color: var(--text-muted); flex-shrink: 0;
      min-width: 54px; text-align: right; transition: opacity .2s;
    }
    .memo-editor-title {
      border: none; outline: none; padding: 18px 16px 8px;
      font-size: 21px; font-weight: 700; font-family: inherit;
      color: var(--text-primary); background: transparent; width: 100%;
    }
    .memo-editor-title::placeholder { color: var(--text-muted); font-weight: 400; }
    .memo-editor-content {
      flex: 1; border: none; outline: none; padding: 8px 16px 32px;
      font-size: 15px; line-height: 1.75; font-family: inherit;
      color: var(--text-primary); background: transparent;
      resize: none; width: 100%;
    }
    .memo-editor-content::placeholder { color: var(--text-muted); }
  </style>
</head>
<body>

<!-- ══ AUTH SCREEN ══ -->
<div class="auth-screen" id="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">하루 계획</div>
    <div class="auth-subtitle">일정과 메모를 한 곳에</div>
    <div class="auth-mode-tabs">
      <button class="auth-mode-tab active" id="auth-mode-login" onclick="setAuthMode('login')">로그인</button>
      <button class="auth-mode-tab" id="auth-mode-signup" onclick="setAuthMode('signup')">회원가입</button>
    </div>
    <input class="auth-input" id="auth-email" type="email" placeholder="이메일"
      onkeydown="if(event.key==='Enter')document.getElementById('auth-password').focus()">
    <input class="auth-input" id="auth-password" type="password" placeholder="비밀번호 (6자 이상)"
      onkeydown="if(event.key==='Enter')authSubmit()">
    <label class="auth-autologin" id="autologin-label">
      <input type="checkbox" id="autologin-checkbox" onchange="setAutoLogin(this.checked)">
      <span>자동로그인</span>
    </label>
    <div class="auth-error" id="auth-error"></div>
    <button class="auth-submit" id="auth-submit" onclick="authSubmit()">로그인</button>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app" style="display:none">
  <div class="header">
    <!-- Row 1: 앱 이름 + 유저 버튼 -->
    <div class="header-row">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="app-name">하루 계획</span>
        <div class="sync-dot" id="sync-dot" onclick="if(currentUser)syncAll()" style="cursor:pointer" title="클릭해서 최신 데이터 가져오기"></div>
      </div>
      <button class="user-btn" id="user-btn" onclick="openAccountPanel()" title="계정">
        <span id="user-initials">?</span>
      </button>
    </div>
    <!-- Row 2: 메인 탭 -->
    <div class="main-tabs-row">
      <div class="main-tab active" id="mtab-schedule" onclick="switchMainTab('schedule')">📅 스케쥴</div>
      <div class="main-tab" id="mtab-memo" onclick="switchMainTab('memo')">📝 메모</div>
    </div>
    <!-- Row 3: 스케쥴 서브네비 -->
    <div id="schedule-subnav">
      <div class="date-nav-row">
        <div class="date-nav">
          <button class="nav-btn" onclick="changeDay(-1)" title="이전 날">‹</button>
          <span class="date-chip" id="date-display"></span>
          <button class="cal-btn" onclick="toggleCalendar(event)" title="달력">📅</button>
          <button class="nav-btn" onclick="changeDay(1)" title="다음 날">›</button>
          <button class="today-jump" id="today-btn" onclick="goToday()" style="display:none">오늘</button>
        </div>
      </div>
      <div class="tabs">
        <div class="tab active" id="tab-exec" onclick="switchTab('exec')">오늘 실행</div>
        <div class="tab" id="tab-plan" onclick="switchTab('plan')">내일 계획</div>
        <div class="tab" id="tab-history" onclick="switchTab('history')">기록</div>
      </div>
    </div>
  </div>

  <div class="content">
    <div id="schedule-content">
      <div id="view-exec"></div>
      <div id="view-plan" style="display:none"></div>
      <div id="view-history" style="display:none"></div>
    </div>
    <div id="memo-content" style="display:none">
      <div class="memo-toolbar">
        <div class="memo-search-wrap">
          <span class="memo-search-icon">🔍</span>
          <input class="memo-search-input" id="memo-search" placeholder="메모 검색..." oninput="memoSearch(this.value)">
        </div>
        <button class="memo-new-btn" onclick="createMemo()">＋ 새 메모</button>
      </div>
      <div class="memo-folders" id="memo-folders"></div>
      <div class="memo-grid" id="memo-grid"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ══ CALENDAR ══ -->
<div class="cal-popup" id="cal-popup">
  <div class="cal-header">
    <span class="cal-month-label" id="cal-month-label"></span>
    <div class="cal-nav-row">
      <button class="cal-nav" onclick="calNav(-1)">▲</button>
      <button class="cal-nav" onclick="calNav(1)">▼</button>
    </div>
  </div>
  <div class="cal-dow">
    <div class="cal-dow-cell">일</div><div class="cal-dow-cell">월</div>
    <div class="cal-dow-cell">화</div><div class="cal-dow-cell">수</div>
    <div class="cal-dow-cell">목</div><div class="cal-dow-cell">금</div>
    <div class="cal-dow-cell">토</div>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- ══ ACCOUNT PANEL ══ -->
<div class="overlay-backdrop" id="account-backdrop" onclick="closeAccountPanel()"></div>
<div class="settings-panel" id="account-panel">
  <div class="panel-handle"></div>
  <div class="panel-title">
    내 계정
    <button class="panel-close" onclick="closeAccountPanel()">×</button>
  </div>
  <div class="panel-section">
    <div class="panel-section-title">로그인 계정</div>
    <div style="font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:16px" id="account-email-display"></div>
    <button class="panel-btn" onclick="pushAllDays();closeAccountPanel()">⬆ 내 데이터 전체 업로드</button>
    <button class="panel-btn danger" onclick="logout()">로그아웃</button>
  </div>
</div>

<!-- ══ MEMO EDITOR PANEL ══ -->
<div class="memo-editor-panel" id="memo-editor-panel">
  <div class="memo-editor-header">
    <button class="memo-editor-back" onclick="closeMemoEditor()">← 닫기</button>
    <div class="memo-color-picker" id="memo-color-picker"></div>
    <div class="memo-save-status" id="memo-save-status"></div>
  </div>
  <input class="memo-editor-title" id="memo-editor-title" placeholder="제목"
    oninput="triggerMemoSave()">
  <textarea class="memo-editor-content" id="memo-editor-content"
    placeholder="내용을 입력하세요..." oninput="triggerMemoSave()"></textarea>
</div>

<script>
// ═══════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════
const KEY = 'haru-v1';
const DEFAULT_SB_URL = 'https://gnryzmjcpsttqmyaiaos.supabase.co';
const DEFAULT_SB_KEY = 'sb_publishable_hROm7-WeRcfkNtV040t2pA_wMEy3heV';
const AUTOLOGIN_KEY = 'haru-autologin';

function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } }
function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }
function getAutoLogin() {
  const v = localStorage.getItem(AUTOLOGIN_KEY);
  return v === null ? true : v === 'true';
}
function setAutoLogin(val) {
  localStorage.setItem(AUTOLOGIN_KEY, val ? 'true' : 'false');
}

// ═══════════════════════════════════════
// AUTH
// ═══════════════════════════════════════
let sbClient = null;
let currentUser = null;
let pollingInterval = null;
let authMode = 'login';

async function initApp() {
  const autoLogin = getAutoLogin();
  const cb = document.getElementById('autologin-checkbox');
  if (cb) cb.checked = autoLogin;
  sbClient = supabase.createClient(DEFAULT_SB_URL, DEFAULT_SB_KEY, {
    auth: { persistSession: autoLogin }
  });

  sbClient.auth.onAuthStateChange((event, session) => {
    if (session?.user) {
      const isNew = !currentUser || currentUser.id !== session.user.id;
      currentUser = { id: session.user.id, email: session.user.email };
      if (isNew || event === 'SIGNED_IN') showApp();
    } else {
      currentUser = null;
      stopPolling();
      showAuthScreen();
    }
  });
}

function showAuthScreen() {
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-error').textContent = '';
}

async function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-initials').textContent = currentUser.email.charAt(0).toUpperCase();
  document.getElementById('account-email-display').textContent = currentUser.email;
  refreshHeader();
  render();
  await pullFromCloud();
  await pullMemos();
  const localDays = Object.keys(load());
  if (localDays.length) await pushAllDays();
  startPolling();
}

function setAuthMode(mode) {
  authMode = mode;
  document.getElementById('auth-mode-login').classList.toggle('active', mode === 'login');
  document.getElementById('auth-mode-signup').classList.toggle('active', mode === 'signup');
  document.getElementById('auth-submit').textContent = mode === 'login' ? '로그인' : '회원가입';
  document.getElementById('auth-error').textContent = '';
}

function getAuthErrorMsg(error) {
  const msg = error.message || '';
  if (msg.includes('Invalid login credentials')) return '이메일 또는 비밀번호가 잘못됐어요';
  if (msg.includes('already registered') || msg.includes('User already registered')) return '이미 가입된 이메일이에요. 로그인해주세요';
  if (msg.includes('Email not confirmed')) return '이메일 인증이 필요해요';
  if (msg.includes('Password should be at least')) return '비밀번호는 6자 이상이어야 해요';
  return msg;
}

async function authSubmit() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  const btn = document.getElementById('auth-submit');
  if (!email || !password) { errEl.textContent = '이메일과 비밀번호를 입력해주세요'; return; }
  btn.disabled = true;
  btn.textContent = authMode === 'login' ? '로그인 중...' : '가입 중...';
  errEl.textContent = '';
  const { error } = authMode === 'login'
    ? await sbClient.auth.signInWithPassword({ email, password })
    : await sbClient.auth.signUp({ email, password });
  btn.disabled = false;
  btn.textContent = authMode === 'login' ? '로그인' : '회원가입';
  if (error) errEl.textContent = getAuthErrorMsg(error);
}

async function logout() {
  await sbClient.auth.signOut();
  closeAccountPanel();
}

function startPolling() {
  stopPolling();
  pollingInterval = setInterval(() => { if (currentUser) pullFromCloud(); }, 30000);
}
function stopPolling() { if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; } }

// ═══════════════════════════════════════
// CLOUD SYNC
// ═══════════════════════════════════════
function cloudReady() { return !!(sbClient && currentUser); }

function setSyncDot(state) {
  const el = document.getElementById('sync-dot');
  if (!el) return;
  el.className = 'sync-dot' + (state !== 'idle' ? ' ' + state : '');
}

async function pullFromCloud() {
  if (!cloudReady()) return;
  setSyncDot('syncing');
  try {
    const { data, error } = await sbClient
      .from('haru_plans').select('date_key,tasks,people').eq('user_id', currentUser.id);
    if (error) throw error;
    if (data && data.length) {
      const local = load();
      data.forEach(row => { local[row.date_key] = { tasks: row.tasks, people: row.people }; });
      save(local); render();
    }
    setSyncDot('ok'); setTimeout(() => setSyncDot('idle'), 3000);
  } catch(e) {
    setSyncDot('err');
    showToast('동기화 오류: ' + (e?.message || e?.code || JSON.stringify(e)));
    console.error('[haru-sync pull]', e);
  }
}

async function sbUpsertDay(dateKeyVal, day) {
  if (!currentUser) return;
  const payload = { tasks: day.tasks, people: day.people, updated_at: new Date().toISOString() };
  const { data: upd, error: ue } = await sbClient.from('haru_plans')
    .update(payload).eq('user_id', currentUser.id).eq('date_key', dateKeyVal).select('date_key');
  if (ue) throw ue;
  if (!upd || !upd.length) {
    const { error: ie } = await sbClient.from('haru_plans')
      .insert({ user_id: currentUser.id, date_key: dateKeyVal, ...payload });
    if (ie) throw ie;
  }
}

async function pushDay(dateKeyVal) {
  if (!cloudReady()) return;
  const day = load()[dateKeyVal]; if (!day) return;
  setSyncDot('syncing');
  try {
    await sbUpsertDay(dateKeyVal, day);
    setSyncDot('ok'); setTimeout(() => setSyncDot('idle'), 2000);
  } catch(e) {
    setSyncDot('err');
    showToast('저장 오류: ' + (e?.message || e?.code || JSON.stringify(e)));
    console.error('[haru-sync push]', e);
  }
}

async function pushAllDays() {
  if (!cloudReady()) { showToast('로그인이 필요해요'); return; }
  const data = load(); const keys = Object.keys(data);
  if (!keys.length) { showToast('업로드할 데이터가 없어요'); return; }
  setSyncDot('syncing'); showToast(`업로드 중... (${keys.length}일)`);
  let ok = 0, firstErr = '';
  for (const key of keys) {
    try { await sbUpsertDay(key, data[key]); ok++; }
    catch(e) { if (!firstErr) firstErr = e?.message || e?.code || JSON.stringify(e); console.error('[pushAllDays]', key, e); }
  }
  const fail = keys.length - ok;
  setSyncDot(fail ? 'err' : 'ok'); setTimeout(() => setSyncDot('idle'), 3000);
  if (fail) showToast(`${ok}일 성공, ${fail}일 실패 — ${firstErr}`);
  else showToast(`업로드 완료: ${ok}일 성공 ✓`);
}

// DATE UTILS
// ═══════════════════════════════════════
const DAYS = ['일','월','화','수','목','금','토'];
function dateKey(d) { return d.toISOString().split('T')[0]; }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function isSameDay(a, b) { return dateKey(a) === dateKey(b); }
function today() { return new Date(); }
function formatDate(d) {
  const t = today();
  const diff = Math.round((new Date(dateKey(d)) - new Date(dateKey(t))) / 86400000);
  const base = `${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;
  if (diff === 0) return base + ' (오늘)';
  if (diff === 1) return base + ' (내일)';
  if (diff === -1) return base + ' (어제)';
  return base;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function startEditTask(dk, taskId) {
  editingItem = { type: 'task', dateKey: dk, id: taskId };
  renderExec();
  setTimeout(() => { const el = document.getElementById(`edit-input-${taskId}`); if (el) { el.focus(); el.select(); } }, 30);
}
function startEditPerson(dk, personId) {
  editingItem = { type: 'person', dateKey: dk, id: personId };
  renderExec();
  setTimeout(() => { const el = document.getElementById(`edit-input-${personId}`); if (el) { el.focus(); el.select(); } }, 30);
}

function saveEdit() {
  if (!editingItem) return;
  const { type, dateKey: dk, id, isNew } = editingItem;
  const input = document.getElementById(`edit-input-${id}`);
  const newVal = input?.value.trim();
  const data = load(); const day = data[dk];
  if (day) {
    if (!newVal && isNew) {
      if (type === 'task') day.tasks = day.tasks.filter(t => t.id !== id);
      else day.people = day.people.filter(p => p.id !== id);
      save(data);
    } else if (newVal) {
      if (type === 'task') {
        const task = day.tasks.find(t => t.id === id); if (task) task.text = newVal;
      } else {
        const person = day.people.find(p => p.id === id);
        if (person) {
          person.name   = newVal;
          const hf = document.getElementById(`edit-hf-${id}`)?.value || '';
          const mf = document.getElementById(`edit-mf-${id}`)?.value || '00';
          const ht = document.getElementById(`edit-ht-${id}`)?.value || '';
          const mt = document.getElementById(`edit-mt-${id}`)?.value || '00';
          person.timeFrom = hf ? `${hf}:${mf}` : '';
          person.timeTo   = ht ? `${ht}:${mt}` : '';
          person.meal     = document.getElementById(`edit-meal-${id}`)?.value || '';
          person.agenda   = document.getElementById(`edit-agenda-${id}`)?.value.trim() || '';
        }
      }
      save(data); pushDay(dk);
    }
  }
  editingItem = null; renderExec();
}

function cancelEdit() {
  if (editingItem?.isNew) {
    const { type, dateKey: dk, id } = editingItem;
    const data = load(); const day = data[dk];
    if (day) {
      if (type === 'task') day.tasks = day.tasks.filter(t => t.id !== id);
      else day.people = day.people.filter(p => p.id !== id);
      save(data);
    }
  }
  editingItem = null; renderExec();
}

function addExecTask(dk) {

  data[dk].tasks.push({ id: newId, text: '', done: false });

function addExecPerson(dk) {
  const data = load();

function deleteTask(dk, taskId) {
  const data = load(); const day = data[dk]; if (!day) return;

function deletePerson(dk, personId) {
  const data = load(); const day = data[dk]; if (!day) return;

function fmtTime(t) { return t ? (t.includes(':') ? t : t + ':00') : '?'; }

function timePickerHTML(timeStr, hAttr, mAttr) {
  const parts = timeStr ? timeStr.split(':') : ['', ''];
  const h = parts[0] || '';
  const mInt = parseInt(parts[1]) || 0;
  const m = String([0,10,20,30,40,50].reduce((p,c) => Math.abs(c-mInt)<Math.abs(p-mInt)?c:p)).padStart(2,'0');
  let hopts = `<option value="">--</option>`;
  for (let i = 10; i <= 22; i++) {
    const v = String(i).padStart(2,'0');
    hopts += `<option value="${v}"${h===v?' selected':''}>${v}</option>`;
  }
  const mopts = ['00','10','20','30','40','50'].map(v => `<option value="${v}"${m===v?' selected':''}>${v}</option>`).join('');
  return `<div class="time-picker"><select class="tp-h" ${hAttr}>${hopts}</select><span class="tp-sep">:</span><select class="tp-m" ${mAttr}>${mopts}</select></div>`;
}

function newPerson(base) { return { id: uid(), name: '', agenda: '', timeFrom: '', timeTo: '', meal: '', ...(base || {}) }; }

function syncPlanDOM() {
  document.querySelectorAll('.plan-input[data-ti]').forEach(el => { if (editTasks[+el.dataset.ti] !== undefined) editTasks[+el.dataset.ti].text = el.value.trim(); });
  document.querySelectorAll('.plan-input[data-pi]').forEach(el => { if (editPeople[+el.dataset.pi] !== undefined) editPeople[+el.dataset.pi].name = el.value.trim(); });
  document.querySelectorAll('[data-pi-hf]').forEach(el => {
    const p = editPeople[+el.dataset.piHf]; if (!p) return;
    const h = el.value, m = document.querySelector(`[data-pi-mf="${el.dataset.piHf}"]`)?.value || '00';
    p.timeFrom = h ? `${h}:${m}` : '';
  });
  document.querySelectorAll('[data-pi-ht]').forEach(el => {
    const p = editPeople[+el.dataset.piHt]; if (!p) return;
    const h = el.value, m = document.querySelector(`[data-pi-mt="${el.dataset.piHt}"]`)?.value || '00';
    p.timeTo = h ? `${h}:${m}` : '';
  });
  document.querySelectorAll('[data-pi-meal]').forEach(el => { const p = editPeople[+el.dataset.piMeal]; if (p) p.meal = el.value; });
  document.querySelectorAll('[data-pi-agenda]').forEach(el => { const p = editPeople[+el.dataset.piAgenda]; if (p) p.agenda = el.value.trim(); });
}

function initPlanState() {
  const data = load();
  const planDate = addDays(today(), planOffset);
  const tKey = dateKey(planDate), prevKey = dateKey(addDays(today(), planOffset - 1));
  const existing = data[tKey], prevData = data[prevKey];
  if (existing) {
    editTasks = existing.tasks.map(t => ({ ...t }));
    editPeople = existing.people.map(p => ({ ...p }));
  } else if (planOffset === 1) {
    const prevTasks = prevData?.tasks || [];
    const carryTasks = prevTasks.filter(t => !t.done).map(t => ({ id: uid(), text: t.text, done: false, carriedFrom: prevKey, repeat: t.repeat || false }));
    const repeatDone = prevTasks.filter(t => t.done && t.repeat).map(t => ({ id: uid(), text: t.text, done: false, carriedFrom: null, repeat: true }));
    editTasks = [...carryTasks, ...repeatDone];
    editPeople = [newPerson(), newPerson()];
  } else { editTasks = []; editPeople = [newPerson(), newPerson()]; }
  while (editTasks.length < 6)  editTasks.push({ id: uid(), text: '', done: false, carriedFrom: null, repeat: false });
  while (editPeople.length < 2) editPeople.push(newPerson());
}

    </div>

          placeholder="${i<3?'중요한 할일을 입력하세요':'할일 입력'}"
          value="${esc(t.text)}" data-ti="${i}"
          oninput="onTaskInput(${i},this.value)" onkeydown="taskKeyNav(event,${i})">
        <button class="repeat-btn${t.repeat?' on':''}" onclick="toggleRepeat(${i})" title="${t.repeat?'반복 켜짐':'반복 꺼짐'}">🔁</button>
        ${canRemove?`<button class="remove-row-btn" onclick="removeTask(${i})" title="삭제">×</button>`:''}
      </div>
      ${isCarried?`<div class="carried-hint">↑ 오늘 미완료에서 이월됨</div>`:''}
      ${t.repeat?`<div class="carried-hint" style="color:var(--accent)">🔁 내일도 자동 추가됩니다</div>`:''}
    </div>`;
  });

  html += `<button class="add-row-btn" onclick="addTask()">＋ 할일 추가</button></div>
    <div class="plan-section"><div class="plan-label">만날 사람</div>`;

  editPeople.forEach((p, i) => {
    const canRemove = editPeople.length > MIN_PEOPLE;
    html += `<div>
      <div class="plan-row">
        <div class="plan-num green-num">${i===0?'👤':'👥'}</div>
        <input class="plan-input" type="text" placeholder="이름" value="${esc(p.name)}"
          data-pi="${i}" oninput="onPersonInput(${i},this.value)" style="flex:0 0 90px;min-width:0">

let calViewMonth = new Date(), calIsOpen = false;
function toggleCalendar(e) { e && e.stopPropagation(); calIsOpen ? closeCalendar() : openCalendar(); }
function openCalendar() {
  calIsOpen = true; calViewMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  renderCalendar(); document.getElementById('cal-popup').classList.add('open');
  setTimeout(() => document.addEventListener('click', calOutsideClick), 10);
}
function closeCalendar() {
  calIsOpen = false; document.getElementById('cal-popup').classList.remove('open');
  document.removeEventListener('click', calOutsideClick);
}
function calOutsideClick(e) {
  const popup = document.getElementById('cal-popup'), btn = document.querySelector('.cal-btn');
  if (!popup.contains(e.target) && (!btn || !btn.contains(e.target))) closeCalendar();
}
function calNav(delta) { calViewMonth = new Date(calViewMonth.getFullYear(), calViewMonth.getMonth()+delta, 1); renderCalendar(); }
function renderCalendar() {
  const data = load(), y = calViewMonth.getFullYear(), m = calViewMonth.getMonth();
  document.getElementById('cal-month-label').textContent = `${y}년 ${m+1}월`;
  const firstDow = new Date(y,m,1).getDay(), daysInMonth = new Date(y,m+1,0).getDate(), prevDays = new Date(y,m,0).getDate();
  const todayStr = dateKey(today()), selStr = dateKey(viewDate);
  let cells = '';
  for (let i = firstDow-1; i >= 0; i--) cells += `<div class="cal-cell other">${prevDays-i}</div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dk = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls = 'cal-cell';
    if (dk===selStr) cls += ' sel'; else if (dk===todayStr) cls += ' today';
    if (data[dk]) cls += ' has-plan';
    cells += `<div class="${cls}" onclick="calPick('${dk}')">${d}</div>`;
  }
  const total = Math.ceil((firstDow+daysInMonth)/7)*7;
  for (let d = 1; d <= total-firstDow-daysInMonth; d++) cells += `<div class="cal-cell other">${d}</div>`;
  document.getElementById('cal-grid').innerHTML = cells;
}
function calPick(key) { viewDate = new Date(key+'T00:00:00'); refreshHeader(); render(); closeCalendar(); }

// HISTORY
// ═══════════════════════════════════════
function renderHistory() {
  const data = load(), el = document.getElementById('view-history');
  const keys = Object.keys(data).sort().reverse();
  if (!keys.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📂</div><div class="empty-title">기록이 없어요</div><div class="empty-desc">"내일 계획"을 저장하면 여기에 기록이 쌓여요</div></div>`;
    return;
  }
  const todayKey = dateKey(today());
  let totalDays=0, perfectDays=0, totalTasks=0, doneTasks=0;
  keys.forEach(k => {
    if (k > todayKey) return;
    const tasks = data[k]?.tasks || []; if (!tasks.length) return;
    totalDays++; const done = tasks.filter(t=>t.done).length;
    doneTasks += done; totalTasks += tasks.length;
    if (done === tasks.length) perfectDays++;
  });
  const avgPct = totalTasks>0 ? Math.round(doneTasks/totalTasks*100) : 0;
  let html = `<div class="history-summary">
    <div class="hs-card"><div class="hs-num">${totalDays}</div><div class="hs-label">기록된 날</div></div>
    <div class="hs-card"><div class="hs-num" style="color:var(--green)">${perfectDays}</div><div class="hs-label">완벽한 날</div></div>
    <div class="hs-card"><div class="hs-num" style="color:var(--accent)">${avgPct}%</div><div class="hs-label">평균 달성률</div></div>
  </div>`;
  const months = {};
  keys.forEach(k => { const m = k.slice(0,7); if (!months[m]) months[m]=[]; months[m].push(k); });
  Object.entries(months).forEach(([month, dayKeys]) => {
    const [y, m] = month.split('-');
    html += `<div class="history-month">${y}년 ${parseInt(m)}월</div>`;
    dayKeys.forEach(k => {
      const day = data[k], tasks = day.tasks||[], people = day.people||[];
      const done=tasks.filter(t=>t.done).length, total=tasks.length;
      const met=people.filter(p=>p.met).length, carried=tasks.filter(t=>t.carriedFrom).length;
      const pct=total>0?Math.round(done/total*100):0;
      const isFuture=k>todayKey, isToday=k===todayKey;
      let status, badgeText;
      if (isFuture)         { status='future';  badgeText='예정'; }
      else if (total===0)   { status='none';    badgeText='기록 없음'; }
      else if (done===total){ status='perfect'; badgeText='완료 🎉'; }
      else if (done>0)      { status='partial'; badgeText=`${pct}%`; }
      else                  { status='none';    badgeText='0%'; }
      const d = new Date(k+'T00:00:00');
      const dateStr=`${parseInt(k.slice(5,7))}월 ${parseInt(k.slice(8,10))}일 ${DAYS[d.getDay()]}요일${isToday?' (오늘)':''}`;
      html += `<div class="hist-card" onclick="goToDate('${k}')">
        <div class="hist-top">
          <span class="hist-date">${dateStr}</span>
          <span class="hist-badge ${status}">${badgeText}</span>
          <button class="hist-del-btn" onclick="event.stopPropagation();deleteHistoryDay('${k}')" title="기록 삭제">🗑</button>
        </div>
        <div class="hist-bar-track"><div class="hist-bar-fill ${status}" style="width:${isFuture?100:pct}%"></div></div>
        <div class="hist-meta">
          <span class="hist-meta-item">✓ ${done}/${total} 할일</span>
          ${people.length>0?`<span class="hist-meta-item">👤 ${met}/${people.length} 만남</span>`:''}
          ${carried>0?`<span class="hist-carried">↩ 이월 ${carried}건</span>`:''}
        </div></div>`;
    });
  });
  el.innerHTML = html;
}
function goToDate(key) { viewDate = new Date(key+'T00:00:00'); refreshHeader(); switchTab('exec'); }
function deleteHistoryDay(key) {
  const label = `${parseInt(key.slice(5,7))}월 ${parseInt(key.slice(8,10))}일`;
  if (!confirm(`${label} 기록을 삭제할까요?\n되돌릴 수 없어요.`)) return;
  const data = load(); delete data[key]; save(data);
  if (sbClient && currentUser) sbClient.from('haru_plans').delete().eq('user_id', currentUser.id).eq('date_key', key).then(()=>{});
  renderHistory();
}

// ═══════════════════════════════════════
// DRAG & DROP
// ═══════════════════════════════════════
let _dnd = null, _touchClone = null;
function dndStart(e,type,key,idx) {
  _dnd={type,key,idx:+idx,toIdx:+idx}; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(idx));
  requestAnimationFrame(()=>e.currentTarget.classList.add('dnd-dragging'));
}
function dndOver(e,idx) {
  e.preventDefault(); e.dataTransfer.dropEffect='move'; if (!_dnd) return;
  const toIdx=+idx;
  if (toIdx!==_dnd.toIdx) {
    document.querySelectorAll('.dnd-over').forEach(el=>el.classList.remove('dnd-over'));
    if (toIdx!==_dnd.idx) e.currentTarget.classList.add('dnd-over'); _dnd.toIdx=toIdx;
  }
}
function dndDrop(e,type,key,idx) { e.preventDefault(); if (!_dnd) return; dndCommit(_dnd.type,_dnd.key,_dnd.idx,+idx); }
function dndEnd() { document.querySelectorAll('.dnd-dragging,.dnd-over').forEach(el=>el.classList.remove('dnd-dragging','dnd-over')); _dnd=null; }
function touchDndStart(e,type,key,idx) {
  if (e.touches.length!==1) return; e.preventDefault(); e.stopPropagation();
  const touch=e.touches[0], item=e.currentTarget.closest('[data-dnd-idx]'), rect=item.getBoundingClientRect();
  _dnd={type,key,idx:+idx,toIdx:undefined,item,startTouchY:touch.clientY,itemTop:rect.top};
  _touchClone=item.cloneNode(true);
  Object.assign(_touchClone.style,{position:'fixed',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',zIndex:'9999',opacity:'.85',pointerEvents:'none',boxShadow:'0 8px 28px rgba(0,0,0,.22)',transform:'scale(1.02)',borderRadius:'10px',transition:'none'});
  document.body.appendChild(_touchClone); item.style.opacity='.25';
  document.addEventListener('touchmove',_onTouchMove,{passive:false});
  document.addEventListener('touchend',_onTouchEnd,{once:true});
}
function _onTouchMove(e) {
  if (!_dnd||!_touchClone) return; e.preventDefault();
  const touch=e.touches[0], dy=touch.clientY-_dnd.startTouchY;
  _touchClone.style.top=(_dnd.itemTop+dy)+'px';
  _touchClone.style.visibility='hidden';
  const under=document.elementFromPoint(touch.clientX,touch.clientY);
  _touchClone.style.visibility='';
  const target=under?.closest('[data-dnd-idx]');
  document.querySelectorAll('.dnd-over').forEach(el=>el.classList.remove('dnd-over'));
  if (target&&target!==_dnd.item) { target.classList.add('dnd-over'); _dnd.toIdx=+target.dataset.dndIdx; } else _dnd.toIdx=undefined;
}
function _onTouchEnd() {
  document.removeEventListener('touchmove',_onTouchMove);
  if (_touchClone) { _touchClone.remove(); _touchClone=null; }
  if (_dnd?.item) _dnd.item.style.opacity='';
  document.querySelectorAll('.dnd-over').forEach(el=>el.classList.remove('dnd-over'));
  if (_dnd?.toIdx!==undefined&&_dnd.toIdx!==_dnd.idx) dndCommit(_dnd.type,_dnd.key,_dnd.idx,_dnd.toIdx);
  _dnd=null;
}
function dndCommit(type,key,fromIdx,toIdx) {
  if (fromIdx===toIdx) return;
  if (type==='exec') {
    const data=load(), tasks=data[key]?.tasks; if (!tasks) return;
    const [item]=tasks.splice(fromIdx,1); tasks.splice(toIdx,0,item);
    save(data); pushDay(key); renderExec();
  } else { syncPlanDOM(); const [item]=editTasks.splice(fromIdx,1); editTasks.splice(toIdx,0,item); renderPlanHTML(); }
}

let memos = [];
let memoFolders = [];
let activeFolderId = null;
let memoSearchQuery = '';

const MEMO_COLOR_BG = {
  '': '#FFFFFF', 'yellow': '#FEF9C3', 'green': '#DCFCE7',
  'blue': '#DBEAFE', 'pink': '#FCE7F3', 'red': '#FEE2E2', 'purple': '#EDE9FE'
};

async function syncAll() {
  await pullFromCloud();
  await pullMemos();
}

async function pullMemos() {
  if (!cloudReady()) return;
  const [mr, fr] = await Promise.all([
    sbClient.from('memos').select('*').eq('user_id', currentUser.id).order('updated_at', { ascending: false }),
    sbClient.from('memo_folders').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: true })
  ]);
  if (!mr.error) memos = mr.data || [];
  if (!fr.error) memoFolders = fr.data || [];
  if (mainTab === 'memo') renderMemoList();
}

async function createMemo() {
  if (!cloudReady()) { showToast('로그인이 필요해요'); return; }
  const { data, error } = await sbClient.from('memos').insert({
    user_id: currentUser.id, title: '', content: '',
    folder_id: activeFolderId, tags: [], pinned: false, color: '',
    has_checklist: false, checklist: []
  }).select().single();
  if (error) { showToast('메모 생성 실패'); console.error(error); return; }
  memos.unshift(data);
  renderMemoList();
  showToast('새 메모를 만들었어요');
}

async function deleteMemo(id) {
  if (!confirm('이 메모를 삭제할까요?\n되돌릴 수 없어요.')) return;
  const { error } = await sbClient.from('memos').delete().eq('id', id).eq('user_id', currentUser.id);
  if (error) { showToast('삭제 실패'); return; }
  memos = memos.filter(m => m.id !== id);
  renderMemoList();
  showToast('삭제됐어요');
}

async function createFolder() {
  const name = prompt('폴더 이름을 입력하세요');
  if (!name?.trim()) return;
  const { data, error } = await sbClient.from('memo_folders').insert({
    user_id: currentUser.id, name: name.trim(), icon: '📁'
  }).select().single();
  if (error) { showToast('폴더 생성 실패'); return; }
  memoFolders.push(data);
  renderMemoList();
}

function switchMemoFolder(id) { activeFolderId = id; renderMemoList(); }

function memoSearch(q) { memoSearchQuery = q; renderMemoList(); }

function getFilteredMemos() {
  let list = activeFolderId !== null
    ? memos.filter(m => m.folder_id === activeFolderId)
    : memos;
  if (memoSearchQuery.trim()) {
    const q = memoSearchQuery.trim().toLowerCase();
    list = list.filter(m =>
      (m.title || '').toLowerCase().includes(q) ||
      (m.content || '').toLowerCase().includes(q)
    );
  }
  return [...list.filter(m => m.pinned), ...list.filter(m => !m.pinned)];
}

function formatMemoDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr), now = new Date();
  const diffMin = Math.floor((now - d) / 60000);
  if (diffMin < 1) return '방금';
  if (diffMin < 60) return `${diffMin}분 전`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `${diffH}시간 전`;
  const diffD = Math.floor(diffH / 24);
  if (diffD < 7) return `${diffD}일 전`;
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function renderMemoFolders() {
  const el = document.getElementById('memo-folders'); if (!el) return;
  let html = `<div class="memo-folder-chip ${activeFolderId === null ? 'active' : ''}" onclick="switchMemoFolder(null)">전체 <span class="memo-folder-count">${memos.length}</span></div>`;
  memoFolders.forEach(f => {
    const cnt = memos.filter(m => m.folder_id === f.id).length;
    html += `<div class="memo-folder-chip ${activeFolderId === f.id ? 'active' : ''}" onclick="switchMemoFolder('${f.id}')">${esc(f.icon)} ${esc(f.name)} <span class="memo-folder-count">${cnt}</span></div>`;
  });
  html += `<button class="memo-folder-add" onclick="createFolder()">＋</button>`;
  el.innerHTML = html;
}

function renderMemoList() {
  renderMemoFolders();
  const grid = document.getElementById('memo-grid'); if (!grid) return;
  const list = getFilteredMemos();
  if (!list.length) {
    const noData = memoSearchQuery ? ['검색 결과가 없어요','다른 키워드로 검색해보세요'] : ['메모가 없어요','＋ 새 메모를 눌러 첫 메모를 작성해보세요'];
    grid.innerHTML = `<div class="memo-empty"><div class="memo-empty-icon">📝</div><div class="memo-empty-title">${noData[0]}</div><div class="memo-empty-desc">${noData[1]}</div></div>`;
    return;
  }
  grid.innerHTML = list.map(m => {
    const bg = MEMO_COLOR_BG[m.color] || '#FFFFFF';
    const title = m.title || '';
    const preview = (m.content || '').slice(0, 80) + ((m.content || '').length > 80 ? '…' : '');
    return `<div class="memo-card" style="background:${bg}" onclick="openMemoEditor('${m.id}')">
      <div class="memo-card-top">
        ${m.pinned ? '<span class="memo-pin-icon">📌</span>' : ''}
        <button class="memo-card-del" onclick="event.stopPropagation();deleteMemo('${m.id}')">🗑</button>
      </div>
      <div class="memo-card-title${!title ? ' placeholder' : ''}">${esc(title || '제목 없음')}</div>
      ${preview ? `<div class="memo-card-preview">${esc(preview)}</div>` : ''}
      <div class="memo-card-date">${formatMemoDate(m.updated_at)}</div>
    </div>`;
  }).join('');
}

const MEMO_COLOR_KEYS = ['', 'yellow', 'green', 'blue', 'pink', 'red', 'purple'];
let currentMemoId = null;
let memoSaveTimer = null;

function openMemoEditor(id) {
  const memo = memos.find(m => m.id === id);
  if (!memo) return;
  currentMemoId = id;
  const panel = document.getElementById('memo-editor-panel');
  panel.style.background = MEMO_COLOR_BG[memo.color] || '#FFFFFF';
  document.getElementById('memo-editor-title').value = memo.title || '';
  document.getElementById('memo-editor-content').value = memo.content || '';
  document.getElementById('memo-save-status').textContent = '';
  renderMemoColorPicker(memo.color || '');
  panel.classList.add('open');
  setTimeout(() => {
    const content = document.getElementById('memo-editor-content');
    content.focus();
    content.setSelectionRange(content.value.length, content.value.length);
  }, 320);
}

function closeMemoEditor() {
  clearTimeout(memoSaveTimer);
  memoSaveTimer = null;
  const memo = memos.find(m => m.id === currentMemoId);
  if (memo) {
    memo.title = document.getElementById('memo-editor-title').value;
    memo.content = document.getElementById('memo-editor-content').value;
    memo.updated_at = new Date().toISOString();
    if (cloudReady()) {
      sbClient.from('memos')
        .update({ title: memo.title, content: memo.content, updated_at: memo.updated_at })
        .eq('id', currentMemoId).eq('user_id', currentUser.id)
        .then(({ error }) => { if (error) console.error('[memo close-save]', error); });
    }
  }
  document.getElementById('memo-editor-panel').classList.remove('open');
  currentMemoId = null;
  renderMemoList();
}

function triggerMemoSave() {
  const statusEl = document.getElementById('memo-save-status');
  if (statusEl) statusEl.textContent = '저장 중...';
  clearTimeout(memoSaveTimer);
  memoSaveTimer = setTimeout(saveMemoNow, 1500);
}

async function saveMemoNow() {
  if (!currentMemoId || !cloudReady()) return;
  memoSaveTimer = null;
  const title = document.getElementById('memo-editor-title').value;
  const content = document.getElementById('memo-editor-content').value;
  const memo = memos.find(m => m.id === currentMemoId);
  if (!memo) return;
  memo.title = title;
  memo.content = content;
  memo.updated_at = new Date().toISOString();
  const { error } = await sbClient.from('memos')
    .update({ title, content, updated_at: memo.updated_at })
    .eq('id', currentMemoId).eq('user_id', currentUser.id);
  const statusEl = document.getElementById('memo-save-status');
  if (!statusEl) return;
  if (error) { statusEl.textContent = '저장 실패'; console.error(error); return; }
  statusEl.textContent = '저장됨 ✓';
  setTimeout(() => { if (statusEl.textContent === '저장됨 ✓') statusEl.textContent = ''; }, 2000);
}

async function setMemoColor(color) {
  if (!currentMemoId || !cloudReady()) return;
  const memo = memos.find(m => m.id === currentMemoId);
  if (!memo) return;
  memo.color = color;
  const bg = MEMO_COLOR_BG[color] || '#FFFFFF';
  document.getElementById('memo-editor-panel').style.background = bg;
  renderMemoColorPicker(color);
  await sbClient.from('memos').update({ color })
    .eq('id', currentMemoId).eq('user_id', currentUser.id);
}

function renderMemoColorPicker(activeColor) {
  const el = document.getElementById('memo-color-picker'); if (!el) return;
  el.innerHTML = MEMO_COLOR_KEYS.map(c =>
    `<button class="memo-color-dot${c === activeColor ? ' active' : ''}"
      style="background:${MEMO_COLOR_BG[c]}"
      onclick="setMemoColor('${c}')"></button>`
  ).join('');
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
initApp();
</script>
</body>
</html>
